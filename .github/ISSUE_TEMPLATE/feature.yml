name: Feature
description: A Forgejo job that the current commands do not cover well.
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the job. Add a curated command only when it removes repeated use of `api inspect`, `api call`, or `api raw`.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The Forgejo job you need to do, and the command you run today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The command or output you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Why the generic API is not enough
      description: What `api raw` or an existing command fails to do for this job.
    validations:
      required: false
