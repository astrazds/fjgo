name: verify

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
      - run: npm ci
      - run: ./scripts/verify.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Build archives
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/release.sh
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p .gocache/tmp
          export GOTMPDIR="$PWD/.gocache/tmp"
          export TMPDIR="$GOTMPDIR"
          go build -o .gocache/write-release-body ./scripts/write-release-body.go
          .gocache/write-release-body
          gh release create "$TAG" dist/* --title "$TAG" --notes-file /tmp/release-notes.md
      - name: Publish npm launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; tag releases must publish the npm launcher" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)"
          test "v$package_version" = "$TAG"
          npm publish
