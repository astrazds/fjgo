name: verify

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  verify:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: srv1-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
      - run: npm ci
      - run: ./scripts/verify.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: srv1-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Build archives
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/release.sh
      - name: Create release and upload assets
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p .gocache/tmp
          export GOTMPDIR="$PWD/.gocache/tmp"
          export TMPDIR="$GOTMPDIR"
          go build -o .gocache/write-release-body ./scripts/write-release-body.go
          .gocache/write-release-body
          curl -fsS -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/release-body.json \
            "$API/repos/$REPO/releases" >/tmp/release.json
          id="$(sed -n 's/.*"id":\([0-9][0-9]*\).*/\1/p' /tmp/release.json | head -n1)"
          test -n "$id"
          for asset in dist/*; do
            curl -fsS -X POST \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$asset" \
              "$API/repos/$REPO/releases/$id/assets?name=$(basename "$asset")" >/dev/null
          done
      - name: Publish npm launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; tag releases must publish the npm launcher" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n1)"
          test "v$package_version" = "$TAG"
          npm publish
